name: Build & Release APK

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if echo "$KEYSTORE_BASE64" | base64 -d > release.keystore 2>/dev/null && [ -s release.keystore ]; then
              echo "KEYSTORE_FILE=$PWD/release.keystore" >> "$GITHUB_ENV"
              echo "Keystore decoded successfully ($(wc -c < release.keystore) bytes)"
            else
              echo "::warning::Keystore decode failed, release APK will use debug signing"
              rm -f release.keystore
            fi
          else
            echo "No KEYSTORE_BASE64 secret configured, release APK will use debug signing"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew test assembleRelease --stacktrace

      - name: Get version info
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | head -n1 | sed -E 's/.*=\s*([0-9]+).*/\1/')
          echo "name=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}-build${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Find APK
        id: apk
        shell: bash
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "name=BiliAudio-${{ steps.version.outputs.name }}.apk" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release APK not found"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "BiliAudio ${{ steps.version.outputs.name }}"
          body: |
            ## BiliAudio ${{ steps.version.outputs.name }}

            - Automated release build for `com.qinghe.biliaudio`
            - Generated from the main branch
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
